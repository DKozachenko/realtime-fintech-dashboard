name: Realtime Fintech Dashboard

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WASM_ARTIFACT_NAME: wasm-generator

# Third-party actions are pinned to commit SHAs, GitHub's own actions/* to major versions (DECISIONS D26).
jobs:
  cache-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Save node_modules to cache
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ github.repository }}-${{ hashFiles('package-lock.json') }}

  # Builds the Wasm package once; deploy and test download it instead of setting up Rust themselves.
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Rust with the Wasm target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: generator
      - name: Install wasm-pack
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: wasm-pack@0.15.1
      - name: Build the Wasm generator
        run: npm run build:wasm
      - name: Upload the Wasm package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WASM_ARTIFACT_NAME }}
          path: src/wasm/generator
          if-no-files-found: error

  deploy:
    needs: [cache-deps, build-wasm]
    # Only develop is published; pull requests and other branches build and test but never deploy.
    if: github.ref_name == 'develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One Pages deployment at a time; a running one is never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Restore node_modules from cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ github.repository }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - name: Download the Wasm package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WASM_ARTIFACT_NAME }}
          path: src/wasm/generator
      - name: Build the app
        run: npm run build:app -- --base-href=/realtime-fintech-dashboard/
      # GitHub Pages has no rewrite rules: serve the app for unknown paths (DECISIONS D20).
      - name: Add SPA fallback
        run: cp dist/realtime-fintech-dashboard/browser/index.html dist/realtime-fintech-dashboard/browser/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/realtime-fintech-dashboard/browser
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  test:
    needs: [cache-deps, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Restore node_modules from cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ github.repository }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      # The worker imports the Wasm package and the test bundle includes the worker.
      - name: Download the Wasm package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WASM_ARTIFACT_NAME }}
          path: src/wasm/generator
      - name: Run Angular unit tests
        run: npm run test:app

  test-wasm:
    needs: [cache-deps]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: generator
      - name: Run Rust unit tests
        run: npm run test:wasm

  lint:
    needs: [cache-deps]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Restore node_modules from cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ github.repository }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - name: Run ESLint
        run: npm run lint
      - name: Run stylelint
        run: npm run stylelint

  lint-rust:
    needs: [cache-deps]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: generator
      - name: Check Rust formatting and run clippy
        run: npm run lint:rust
